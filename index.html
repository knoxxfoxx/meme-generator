<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Left Sidebar -->
        <aside class="left-sidebar">
            <div class="sidebar-header">
                <h2>🎭 Templates</h2>
            </div>
            
            <div class="sidebar-content">
                <!-- Upload Section -->
                <div class="upload-section">
                    <label for="imageUpload" class="upload-btn">
                        <span class="upload-icon">📤</span>
                        <span>Upload Image</span>
                    </label>
                    <input type="file" id="imageUpload" accept="image/*" style="display: none;">
                </div>

                <!-- Template Gallery -->
                <div class="templates-section">
                    <h3>Choose Template</h3>
                    <div id="templateGallery" class="template-gallery">
                        <!-- Templates will be dynamically loaded here -->
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <div class="canvas-container">
                <canvas id="memeCanvas"></canvas>
            </div>
        </main>

        <!-- Bottom Toolbar -->
        <footer class="bottom-toolbar">
            <div class="toolbar-content">
                <!-- Text Inputs -->
                <div class="text-inputs">
                    <div class="text-input-group">
                        <label for="topText">Top Text</label>
                        <input type="text" id="topText" placeholder="Enter top text..." maxlength="50">
                    </div>
                    <div class="text-input-group">
                        <label for="bottomText">Bottom Text</label>
                        <input type="text" id="bottomText" placeholder="Enter bottom text..." maxlength="50">
                    </div>
                </div>

                <!-- Controls -->
                <div class="toolbar-controls">
                    <div class="control-group">
                        <label for="fontSize">
                            <span class="control-label">Size</span>
                            <span id="fontSizeValue" class="control-value">40</span>
                        </label>
                        <input type="range" id="fontSize" min="20" max="240" value="40">
                    </div>
                    
                    <div class="control-group">
                        <label for="textColor" class="color-label">
                            <span class="control-label">Color</span>
                        </label>
                        <input type="color" id="textColor" value="#FFFFFF">
                    </div>

                    <button id="downloadBtn" class="download-btn">
                        <span>💾</span>
                        <span>Download</span>
                    </button>
                </div>
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
